version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: backbench-postgres
    environment:
      POSTGRES_USER: backbench
      POSTGRES_PASSWORD: backbench
      POSTGRES_DB: backbench
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: backbench-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ../
      dockerfile: apps/api/Dockerfile
    container_name: backbench-api
    ports:
      - "4000:4000"
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ../
      dockerfile: apps/worker/Dockerfile
    container_name: backbench-worker
    ports:
      - "4001:4001"
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
    container_name: backbench-web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata: